[package]
name = "ananke"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ananke"
path = "src/main.rs"

[lib]
name = "ananke"
path = "src/lib.rs"

[dependencies]
ananke-api.workspace = true
ananke-config.workspace = true
ananke-errors.workspace = true
ananke-estimate.workspace = true
ananke-events.workspace = true
ananke-fs.workspace = true
ananke-gguf.workspace = true
ananke-placement.workspace = true
ananke-spawn.workspace = true
ananke-time.workspace = true

tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
reqwest.workspace = true

serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true

utoipa.workspace = true
utoipa-axum.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
smol_str.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
base64.workspace = true
notify.workspace = true
sha2.workspace = true
ulid.workspace = true
async-trait.workspace = true
pin-project-lite.workspace = true
futures.workspace = true
regex.workspace = true
libc.workspace = true

nvml-wrapper.workspace = true
nix.workspace = true

rusqlite.workspace = true

rust-embed.workspace = true
mime_guess.workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
# The calibration dataset's schema, for the integration test that replays the
# campaign's measurements against the estimator. A test dependency only: nothing
# in the daemon reads the dataset.
ananke-dataset.workspace = true
proptest.workspace = true
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-stream.workspace = true
futures.workspace = true
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }

[features]
default = []
test-fakes = []
